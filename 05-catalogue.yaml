- name: configuring catalogue server
  hosts: catalogue
  become: yes
  tasks:
  - name: enable the nodejs:20
    command: dnf module enable nodejs:20 -y
  - name: Installing nodejs server
    package:
      name: nodejs
      state: present
  - name: create roboshop system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: remove the app directory
    file:
      path: /app
      state: absent
  - name: delete the catalogue.zip file from tmp directory
    file:
      path: /tmp/catalogue.zip
      state: absent
  - name: create app directory
    file:
      path: /tmp
      state: directory
      mode: '0755'
  - name: download catalogue
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip
  - name: unzip catalogue
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  - name: Installing dependencies
    community.general.npm:
      path: /app
  - name: copying catalogue.service file
    copy:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
  - name: copy mongo.repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: Installing mongodb client
    package:
      name: mongodb-mongosh
      state: present
  - name: check the catalogue schema is exist or not
    shell: mongosh --host "{{ MONGODB_HOST }}" --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output
  - name: print catalogue_output
    debug:
      msg: "{{ catalogue_output }}"
  - name: Load the data
    shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout | int < 0
  - name: demon reload
    systemd_service:
      name: catalogue
      daemon_reload: true
  - name: start and enable
    service:
      name: catalogue
      state: restarted
      enabled: yes
  
