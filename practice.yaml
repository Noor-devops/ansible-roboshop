- name: roboshop instances management
  hosts: localhost         # Changed from 'local' to standard 'localhost'
  connection: local
  
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: nirfaws.online
    action: create         # Default fallback action

  tasks:
    # =========================================================================
    # CREATE LIFECYCLE
    # =========================================================================
    - name: create ec2 instances
      amazon.aws.ec2_instance:
        state: present
        instance_type: t3.micro
        name: "roboshop-{{ item }}"
        image_id: "{{ image_id }}"
        region: us-east-1
        security_groups:
          - "roboshop-{{ item }}"
          - roboshop-common
      loop: "{{ instances }}"
      register: ec2_output
      when: action == "create"

    - name: create r53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: ["{{ item.instances[0].private_ip_address }}"]  # Wrapped in a list []
        overwrite: true
      loop: "{{ ec2_output.results | default([]) }}"           # Default guard if skipped
      when: action == "create"
      
    - name: create r53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: ["{{ item.instances[0].public_ip_address }}"]   # Wrapped in a list []
        overwrite: true
      loop: "{{ ec2_output.results | default([]) }}"           # Default guard if skipped
      when: 
        - action == "create"
        - item.item == "frontend" 

    # =========================================================================
    # DELETE/DESTROY LIFECYCLE
    # =========================================================================
    # Before deleting the instances, we ask AWS what their current IPs are
    # so we can supply those IPs to the Route53 deletion tasks.
    - name: gather current ec2 instance details for deletion
      amazon.aws.ec2_instance_info:
        region: us-east-1
        filters:
          "tag:Name": "roboshop-*"
          instance-state-name: [ "running", "pending" ]
      register: current_instances
      when: action == "delete"

    - name: delete r53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item.tags.Name.replace('roboshop-', '') }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: ["{{ item.private_ip_address }}"]
      loop: "{{ current_instances.instances | default([]) }}"  
      when: action == "delete"

    # Only runs exactly once to remove the root domain mapping
    - name: delete r53 record for frontend
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: ["{{ item.public_ip_address }}"]
      loop: "{{ current_instances.instances | default([]) }}"  
      when: 
        - action == "delete"
        - item.tags.Name == "roboshop-frontend"
  
    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        wait: false
        region: us-east-1
      loop: "{{ instances }}"  
      when: action == "delete"
