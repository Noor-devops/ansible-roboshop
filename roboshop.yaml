- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: mongodb
    image_id: ami-0220d79f3f480ecf5
    domain_name: nirfaws.online
    action: create
  tasks:
  - name: launching/creating ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ instances }}"
      instance_type: t3.micro
      image_id: "{{ image_id }}"
      region: us-east-1
      security_groups: 
      - roboshop-common
      - "roboshop-{{ instances }}"
    register: ec2_output
  # - name: print ec2_output
  #   debug:
  #     msg: "{{ ec2_output }}"
  - name: getting private ip address
    debug:
      msg: "privateIP: {{ ec2_output.instances[0].private_ip_address }}"
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ instances }}.{{ domain_name }}" #mongodb.nirfaws.online
      type: A
      ttl: 1
      value: "{{ ec2_output.instances[0].private_ip_address }}"