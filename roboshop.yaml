- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: nirfaws.online
  tasks:
  - name: launching/creating ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: t3.micro
      image_id: "{{ image_id }}"
      region: us-east-1
      security_groups: 
      - roboshop-common
      - "roboshop-{{ item }}"
    loop: "{{ instances }}"  
    register: ec2_output
  # - name: print ec2_output
  #   debug:
  #     msg: "{{ ec2_output }}"
  # - name: getting private ip address
  #   debug:
  #     msg: "Instance Name: {{ item.item }} privateIP: {{ item.instances[0].private_ip_address }}"
  #   loop: "{{ ec2_output.results }}"
  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongodb.nirfaws.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
    loop: "{{ ec2_output.results }}"