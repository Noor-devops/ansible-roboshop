- name: configuring redis server
  hosts: redis
  become: yes

  tasks:
  - name: enable redis:7
    command: dnf module enable redis:7 -y
  - name: Installing redis:7
    package:
      name: redis
      state: present
  - name: all remote connection
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  - name: change protected mode
    lineinfile: 
      path: /etc/redis/redis.conf
      regexp: 'protected-mode'
      line: 'protected-mode no'
  - name: start and enable
    service:
      name: redis
      state: started
      enabled: yes