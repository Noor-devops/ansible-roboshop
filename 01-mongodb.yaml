- name: configuring mongodb server
  hosts: mongodb
  become: yes

  tasks:
  - name: copying mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: Installing mongodb server
    package:
      name: mongodb-org
      state: present
  - name: all remote connection
    replace:
      path: /etc/mongod.conf
      regexp: 127.0.0.1
      replace: 0.0.0.0
  - name: enable and restart
    service:
      name: mongod
      state: started
      enabled: yes