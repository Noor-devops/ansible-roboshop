- name: configuring mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: Installing mysql-server
    package:
      name: mysql-server
      state: present
  - name: start and enabled the server
    service:
      name: mysqld
      state: started
      enabled: yes
  - name: set the root password
    command: mysql_secure_installation --set-root-pass RoboShop@1